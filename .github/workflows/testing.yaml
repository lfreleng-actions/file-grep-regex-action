# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Action Testing"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 4
    steps:
      # Perform setup prior to running test(s)
      - name: "Checkout sample project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "lfreleng-actions/test-python-project"
          path: "test-python-project"
          persist-credentials: false

      - name: "Extract project name from pyproject.toml"
        id: test-grep
        uses: $/
        with:
          flags: "-oP -m1"
          regex: '(?<=^name = ")([^"]*)'
          filename: "test-python-project/pyproject.toml"

      - name: 'Check for [tool.coverage.run] in pyproject.toml'
        uses: $/
        id: cov-run
        with:
          flags: '-E'
          regex: '^\[tool\.coverage\.run\]$'
          filename: "test-python-project/pyproject.toml"

      - name: "Validate cov-run output"
        shell: bash
        env:
          COV_RUN: "${{ steps.cov-run.outputs.extracted_string }}"
        run: |
          # Validate cov-run output
          if [ "$COV_RUN" != '[tool.coverage.run]' ]; then
            echo "Unexpected extracted_string: '$COV_RUN' ❌"
            exit 1
          fi
          echo "Test passed ✅"

      - name: 'No match [input: no_fail]'
        uses: $/
        id: no-match
        with:
          flags: '-E'
          regex: '^\[tool\.coverage\.nonexistent\]$'
          filename: "test-python-project/pyproject.toml"
          no_fail: 'true'

      - name: "Validate no-match output is empty"
        shell: bash
        env:
          NO_MATCH: "${{ steps.no-match.outputs.extracted_string }}"
        run: |
          # Validate no-match output is empty
          if [ -n "$NO_MATCH" ]; then
            echo "Unexpected extracted_string: '$NO_MATCH' ❌"
            exit 1
          fi
          echo "Test passed ✅"

      - name: 'Invalid path [input: no_fail]'
        uses: $/
        id: no_fail
        with:
          flags: '-q -E'
          regex: '^\[tool.coverage.run\]\$'
          filename: "invalid.txt"
          no_fail: 'true'

      - name: 'Invalid path [Fail]'
        uses: $/
        id: failure
        continue-on-error: true
        with:
          flags: '-q -E'
          regex: '^\[tool.coverage.run\]\$'
          filename: "invalid.txt"

      # Failure testing is also important
      - name: "Error if step above did NOT fail"
        if: steps.failure.outcome == 'success'
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail ❌"
          exit 1

      - name: "Validate action output: ${{ github.repository }}"
        shell: bash
        env:
          EXTRACTED_STRING: "${{ steps.test-grep.outputs.extracted_string }}"
        run: |
          # Validate Action Output
          if [ "$EXTRACTED_STRING" \
            != "lfreleng-test-python-project" ]; then
            echo "Unexpected return value for: test-python-project ❌"
            echo "Returned: $EXTRACTED_STRING"
            echo "Expected: lfreleng-test-python-project"
            echo "Test failed ❌"
            exit 1
          else
            echo "Test passed ✅"
          fi

      - name: "Validate action does not export to job environment"
        shell: bash
        run: |
          # Validate action does not export to job environment
          if [ -n "${extracted_string+set}" ]; then
            echo "Error: extracted_string leaked into job environment ❌"
            exit 1
          fi
          echo "Test passed ✅"

      # A multi-line match containing a bare 'EOF' line must not end the
      # output value early or inject extra values
      - name: "Create multi-line fixture containing EOF"
        shell: bash
        run: |
          # Create multi-line fixture containing EOF
          printf '%s\n' 'version = "1.0"' 'EOF' 'GREP_TEST_INJECTED=1' \
            > multiline-fixture.txt

      - name: "Extract multi-line match containing EOF"
        id: multiline
        uses: $/
        with:
          flags: "-A2"
          regex: "^version"
          filename: "multiline-fixture.txt"

      - name: "Validate multi-line output"
        shell: bash
        env:
          EXTRACTED_STRING: "${{ steps.multiline.outputs.extracted_string }}"
        run: |
          # Validate multi-line output
          expected=$(cat multiline-fixture.txt)
          if [ "$EXTRACTED_STRING" != "$expected" ]; then
            echo "Unexpected multi-line output ❌"
            echo "Returned: $EXTRACTED_STRING"
            echo "Expected: $expected"
            exit 1
          fi
          if [ -n "${GREP_TEST_INJECTED+set}" ]; then
            echo "Error: matched content injected a variable ❌"
            exit 1
          fi
          echo "Test passed ✅"
